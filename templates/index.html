<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Locator Extractor Pro</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .preview-frame * { box-sizing: border-box; }
    .preview-highlight { outline: 3px solid rgba(99,102,241,0.9); outline-offset: 2px; background: rgba(99,102,241,0.04); }
    .toast { transition: transform .15s ease, opacity .15s ease; }
    .truncate-250 { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-slate-50 to-white text-slate-800">

<div class="max-w-7xl mx-auto px-6 py-10">
  <div class="flex items-center justify-between gap-4 mb-6">
    <div class="flex items-center gap-3">
      <img src="https://cdn-icons-png.flaticon.com/512/3097/3097980.png" alt="Logo" class="h-12 w-12">
      <div>
        <h1 class="text-3xl sm:text-4xl font-extrabold text-indigo-600">Locator Extractor <span class="text-indigo-400">Pro</span></h1>
        <p class="mt-1 text-sm text-gray-500">Extract locators with nested text support, instant copy & export.</p>
      </div>
    </div>
    <div class="flex gap-2">
      <button id="copyAll" class="px-4 py-2 rounded-lg bg-emerald-500 text-white hover:brightness-95">Copy All</button>
      <button id="downloadCsv" class="px-4 py-2 rounded-lg bg-gray-800 text-white hover:brightness-95">Download CSV</button>
    </div>
  </div>

  <!-- input + preview -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2 bg-white p-6 shadow rounded-2xl">
      <label class="text-sm font-medium text-gray-600">Paste HTML</label>
      <textarea id="htmlInput" rows="10" class="mt-2 w-full p-4 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-300" placeholder="Paste your HTML here..."></textarea>

      <div class="flex items-center gap-3 mt-4">
        <button id="extractBtn" class="px-5 py-2 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 text-white shadow">Extract Locators</button>
        <input id="searchBox" class="ml-auto px-3 py-2 border rounded-lg w-60" placeholder="Search (label, id, xpath, css)...">
      </div>

      <div class="mt-6">
        <label class="text-sm text-gray-500">HTML Preview (hover row / element to highlight)</label>
        <div id="preview" class="preview-frame mt-3 p-4 border border-dashed rounded-xl h-72 overflow-auto bg-slate-50"></div>
      </div>
    </div>

    <!-- table card -->
    <div class="bg-white p-6 shadow rounded-2xl">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-semibold text-lg">Extracted Locators</h2>
        <div class="text-sm text-gray-500">Click cell to copy • Click row to copy JSON</div>
      </div>

      <div id="tableWrap" class="max-h-[520px] overflow-auto">
        <table id="locatorsTable" class="min-w-full text-sm">
          <thead class="sticky top-0 bg-white">
            <tr class="text-left">
              <th class="py-3 px-2 text-xs text-gray-500">Label</th>
              <th class="py-3 px-2 text-xs text-gray-500">Tag</th>
              <th class="py-3 px-2 text-xs text-gray-500">ID</th>
              <th class="py-3 px-2 text-xs text-gray-500">Name</th>
              <th class="py-3 px-2 text-xs text-gray-500">Class</th>
              <th class="py-3 px-2 text-xs text-gray-500">CSS</th>
              <th class="py-3 px-2 text-xs text-gray-500">XPath</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="align-top"></tbody>
        </table>
      </div>

      <div class="mt-4 text-sm text-gray-500">
        Only interactive tags or elements with id/name/class will appear.
      </div>
    </div>
  </div>
</div>

<div id="toastContainer" class="fixed bottom-6 right-6 flex flex-col gap-2 z-50"></div>

<script>
let latestLocators = [];
let previewElementMap = new Map();

function showToast(msg, type='success') {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast px-4 py-2 rounded-lg shadow-lg text-white';
  el.style.opacity = '0.98';
  el.style.transform = 'translateY(6px)';
  el.innerText = msg;
  if (type === 'success') el.style.background = 'linear-gradient(90deg,#10b981,#059669)';
  else el.style.background = '#ef4444';
  container.appendChild(el);
  setTimeout(()=> { el.style.transform='translateY(0)'; }, 10);
  setTimeout(()=> { el.remove(); }, 2400);
}

function downloadFile(filename, content, mime='application/json') {
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

document.getElementById('extractBtn').addEventListener('click', async () => {
  const html = document.getElementById('htmlInput').value.trim();
  if (!html) { showToast('Paste HTML first', 'error'); return; }
  try {
    const res = await fetch('/extract-locators', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({html})
    });
    const data = await res.json();
    if (data.error) { showToast(data.error, 'error'); return; }
    latestLocators = data;
    renderTable(latestLocators);
    renderPreview(html, latestLocators);
    showToast(`Extracted ${latestLocators.length} locators`);
  } catch (e) {
    console.error(e);
    showToast('Extraction failed', 'error');
  }
});

document.getElementById('searchBox').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase();
  const filtered = latestLocators.filter(l => {
    const combined = `${l.label||''} ${l.tag_name||''} ${l.id||''} ${l.name||''} ${l.class_name||''} ${l.css_selector||''} ${l.xpath||''}`.toLowerCase();
    return combined.includes(q);
  });
  renderTable(filtered);
});

document.getElementById('copyAll').addEventListener('click', () => {
  if (!latestLocators.length) { showToast('No locators to copy', 'error'); return; }
  navigator.clipboard.writeText(JSON.stringify(latestLocators, null, 2)).then(()=> showToast('All locators copied'));
});

document.getElementById('downloadJson').addEventListener('click', () => {
  if (!latestLocators.length) { showToast('No locators to download', 'error'); return; }
  downloadFile('locators.json', JSON.stringify(latestLocators, null, 2), 'application/json');
});

document.getElementById('downloadCsv').addEventListener('click', () => {
  if (!latestLocators.length) { showToast('No locators to download', 'error'); return; }
  const keys = ['label','tag_name','id','name','class_name','css_selector','xpath'];
  const rows = [keys.join(',')];
  latestLocators.forEach(loc => {
    const row = keys.map(k => `"${(loc[k]||'').toString().replace(/"/g,'""')}"`).join(',');
    rows.push(row);
  });
  downloadFile('locators.csv', rows.join('\n'), 'text/csv');
});

/* ---------- Render Table ---------- */
function renderTable(list) {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  list.forEach((loc, idx) => {
    const tr = document.createElement('tr');
    tr.className = 'hover:bg-slate-50 cursor-pointer';
    tr.dataset.index = idx;

    tr.addEventListener('click', (e) => {
      if (e.target.dataset && e.target.dataset.skipRowCopy === 'true') return;
      navigator.clipboard.writeText(JSON.stringify(loc, null, 2)).then(()=> showToast('Copied element JSON'));
    });

    function makeCell(text, title) {
      const td = document.createElement('td');
      td.className = 'py-3 px-2 align-top';
      if (!text) { td.innerHTML = '<span class="text-xs text-gray-400 italic">-</span>'; return td; }
      const span = document.createElement('span');
      span.className = 'truncate-250 inline-block';
      span.textContent = text;
      if (title) span.title = title;
      span.addEventListener('click', ev => {
        ev.stopPropagation();
        navigator.clipboard.writeText(text).then(()=> showToast(`Copied: ${text.length>60? text.slice(0,60)+'...': text}`));
      });
      span.dataset.skipRowCopy = 'true';
      td.appendChild(span);
      return td;
    }

    tr.appendChild(makeCell(loc.label||'Unnamed', loc.label||''));
    tr.appendChild(makeCell(loc.tag_name||'', loc.tag_name||''));
    tr.appendChild(makeCell(loc.id||'', loc.id||''));
    tr.appendChild(makeCell(loc.name||'', loc.name||''));
    tr.appendChild(makeCell(loc.class_name||'', loc.class_name||''));
    tr.appendChild(makeCell(loc.css_selector||'', loc.css_selector||''));
    tr.appendChild(makeCell(loc.xpath||'', loc.xpath||''));

    tr.addEventListener('mouseenter', () => {
      const mapEl = previewElementMap.get(idx);
      if (mapEl) mapEl.classList.add('preview-highlight');
    });
    tr.addEventListener('mouseleave', () => {
      const mapEl = previewElementMap.get(idx);
      if (mapEl) mapEl.classList.remove('preview-highlight');
    });

    tbody.appendChild(tr);
  });
}

/* ---------- Render Preview ---------- */
function renderPreview(html, locators) {
  const preview = document.getElementById('preview');
  preview.innerHTML = '';
  previewElementMap.clear();

  const container = document.createElement('div');
  container.innerHTML = html;
  container.className = 'preview-root space-y-2';

  locators.forEach((loc, i) => {
    let el = null;
    try { if (loc.id) el = container.querySelector(`#${CSS.escape(loc.id)}`); } catch{}
    if (!el && loc.name) el = container.querySelector(`[name="${loc.name}"]`);
    if (!el && loc.class_name) el = container.querySelector(`.${loc.class_name.split(' ').map(c=>CSS.escape(c)).join('.')}`);
    if (!el && loc.css_selector) { try { el = container.querySelector(loc.css_selector); } catch{} }
    if (!el && loc.xpath) {
      try {
        const doc = container.ownerDocument || document;
        const res = doc.evaluate(loc.xpath, container, null, XPathResult.FIRST_ORDERED_NODE_TYPE, null);
        if (res && res.singleNodeValue) el = res.singleNodeValue;
      } catch{}
    }
    if (!el && loc.tag_name) el = container.querySelector(loc.tag_name);

    if (el) {
      el.dataset.locatorIndex = i;
      el.addEventListener('mouseenter', () => {
        const row = document.querySelector(`#tableBody tr[data-index="${i}"]`);
        if (row) row.classList.add('bg-indigo-50');
        el.classList.add('preview-highlight');
      });
      el.addEventListener('mouseleave', () => {
        const row = document.querySelector(`#tableBody tr[data-index="${i}"]`);
        if (row) row.classList.remove('bg-indigo-50');
        el.classList.remove('preview-highlight');
      });
      el.addEventListener('click', ev => {
        ev.stopPropagation();
        navigator.clipboard.writeText(JSON.stringify(loc, null, 2)).then(()=> showToast('Copied element JSON from preview'));
      });
      previewElementMap.set(i, el);
    }
  });

  preview.appendChild(container);
}

if (!CSS.escape) { CSS.escape = function(v){return String(v).replace(/([^\x20-\x7E]|["'\\#;:<>~\[\]\(\)])/g,'\\$&'); }; }
</script>
</body>
</html>
